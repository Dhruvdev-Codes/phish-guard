<!DOCTYPE html>
<html>
<head>
    <title>Phish-Guard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Phish-Guard Analyzer</h1>
        <p>Paste a suspicious email or text message below:</p>
        
        <textarea id="emailInput" rows="10" cols="50" placeholder="Paste the suspicious message here..."></textarea>
        <br><br>
        
        <button id="scanButton">Scan for Threats</button>

        <h2>Analysis Results:</h2>
        <p id="resultArea">Waiting for input...</p>
    </div>

    <script src="app.js"></script>
</body>
</html>
